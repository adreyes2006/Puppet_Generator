name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (pure Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install "pytest==8.3.5"

      - name: Run unit tests
        run: python -m pytest tests/unit

  blender-tests:
    name: Blender tests (headless 4.2 LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        uses: actions/cache@v4
        with:
          path: blender-4.2.3-linux-x64
          key: blender-4.2.3-linux-x64

      - name: Install Blender 4.2.3
        run: |
          if [ ! -x blender-4.2.3-linux-x64/blender ]; then
            curl -fL -o /tmp/blender.tar.xz \
              https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
            tar -xJf /tmp/blender.tar.xz
          fi
          echo "$PWD/blender-4.2.3-linux-x64" >> "$GITHUB_PATH"

      - name: Runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 xvfb libgl1-mesa-dri

      - name: Run Blender test suite
        run: xvfb-run -a blender --background --factory-startup --python tests/blender/run_in_blender.py
